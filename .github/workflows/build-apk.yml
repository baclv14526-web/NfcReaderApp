name: Build & Sign APK

# Chạy khi push lên nhánh main/master, khi tạo PR, hoặc chạy tay từ tab Actions
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

# Cho phép workflow tạo Release và đính kèm file APK
permissions:
  contents: write

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cài đặt Android SDK
        uses: android-actions/setup-android@v3

      - name: Cài đặt Gradle (có cache sẵn để build lần sau nhanh hơn)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
          cache-read-only: false

      # ---------------------------------------------------------------
      # Chuẩn bị keystore để ký APK.
      # Nếu bạn đã tạo Secrets KEYSTORE_BASE64 / KEYSTORE_PASSWORD /
      # KEY_ALIAS / KEY_PASSWORD trong Settings > Secrets and variables >
      # Actions của repo, workflow sẽ dùng đúng keystore đó -> chữ ký
      # KHÔNG đổi giữa các lần build (bắt buộc nếu muốn cài đè bản cập
      # nhật lên bản cũ mà không cần gỡ app trước).
      #
      # Nếu chưa cấu hình Secrets, workflow sẽ TỰ TẠO một keystore mới
      # cho lần build này để APK vẫn có chữ ký và cài đặt được ngay,
      # đồng thời đính kèm file .jks đó vào Artifacts để bạn tải về,
      # convert sang base64 rồi lưu làm Secret cho các lần build sau.
      # ---------------------------------------------------------------
      - name: Chuẩn bị keystore
        id: keystore
        run: |
          mkdir -p keystore_dir
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Dùng keystore từ Secrets (chữ ký cố định)"
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore_dir/release.jks
            echo "STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            echo "Chưa có Secrets, tự tạo keystore mới cho lần build này"
            keytool -genkeypair -v \
              -keystore keystore_dir/release.jks \
              -alias nfcreader \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass nfcreader123 -keypass nfcreader123 \
              -dname "CN=NFC Reader, OU=Dev, O=Dev, L=HN, S=HN, C=VN"
            echo "STORE_PASSWORD=nfcreader123" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=nfcreader" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=nfcreader123" >> "$GITHUB_ENV"
          fi
          echo "KEYSTORE_PATH=$(pwd)/keystore_dir/release.jks" >> "$GITHUB_ENV"

      - name: Build APK bản release (đã ký)
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ env.STORE_PASSWORD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Tìm file APK vừa build
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "Đã build: $APK_PATH"

      - name: Tải APK lên Artifacts (luôn có, mọi lần build)
        uses: actions/upload-artifact@v4
        with:
          name: nfc-reader-release-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30

      # Chỉ đính kèm keystore vào Artifacts khi KHÔNG dùng Secrets,
      # để bạn tải về và lưu làm Secret cho các lần build sau (giữ chữ ký cố định).
      - name: Tải keystore tự tạo lên Artifacts (chỉ khi chưa cấu hình Secrets)
        if: ${{ secrets.KEYSTORE_BASE64 == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: generated-keystore-KHONG-CHIA-SE
          path: keystore_dir/release.jks
          retention-days: 30

      # Tạo GitHub Release kèm APK để cài đặt dễ dàng bằng 1 link, chỉ chạy khi push lên main/master
      - name: Tạo Release và đính kèm APK
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "NFC Reader build #${{ github.run_number }}"
          body: |
            APK được build và ký tự động từ commit ${{ github.sha }}.
            Tải file .apk bên dưới về điện thoại và cài đặt (nhớ bật "Cài đặt từ nguồn không xác định").
          files: ${{ steps.find_apk.outputs.apk_path }}
